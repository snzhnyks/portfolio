<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yuliana | Hospitality Performance & Brand Specialist</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #063f47;
      --surface: rgba(255, 248, 238, 0.08);
      --surface-strong: rgba(255, 248, 238, 0.15);
      --text: #F5EFE6;
      --muted: #C7B89C;
      --gold: #D3B46E;
      --accent: #F0E3C6;
      --border: rgba(255, 248, 238, 0.18);
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, "Helvetica Neue", Arial, sans-serif;
      background: radial-gradient(circle at top left, rgba(211, 180, 110, 0.12), transparent 26%),
        radial-gradient(circle at bottom right, rgba(240, 227, 198, 0.08), transparent 20%),
        var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .page {
      max-width: 1080px;
      margin: 0 auto;
      padding: 36px 24px 60px;
    }

    .header {
      display: grid;
      gap: 24px;
      padding: 36px 32px;
      background: rgba(255, 248, 238, 0.08);
      border: 1px solid var(--border);
      border-radius: 32px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .title {
      margin: 0;
      font-size: clamp(2.8rem, 4vw, 4.2rem);
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .subtitle {
      margin: 8px 0 0;
      color: var(--muted);
      max-width: 720px;
      font-size: 1.05rem;
    }
